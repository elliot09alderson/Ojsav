<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./nlf.css">
    <title>Neon Login</title>
</head>
<body>
    <div class="container">
        <div class="from-box">
            <h2>Login Your Account</h2>
            <form>
                <div class="input-box">
                    <input type="text" required>
                    <span>Username</span>
                    <i></i>
                </div>
                <div class="input-box">
                    <input type="password" required>
                    <span>Password</span>
                    <i></i>
                </div>
                <div class="links">
                    <a href="#">Forget Password?</a>
                    <a href="#">Sing Up</a>
                </div>
                <input type="submit" value="Login">
            </form>
        </div>
    </div>
</body>
</html>
